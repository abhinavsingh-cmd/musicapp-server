<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8B5CF6"/>
      <stop offset="50%" style="stop-color:#D946EF"/>
      <stop offset="100%" style="stop-color:#F0ABFC"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.4"/>
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#8B5CF6" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background circle with bubble effect -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" filter="url(#shadow)"/>
  
  <!-- Inner bubble highlights -->
  <ellipse cx="200" cy="180" rx="100" ry="80" fill="url(#shine)" opacity="0.6"/>
  <circle cx="180" cy="160" r="40" fill="white" opacity="0.15"/>
  
  <!-- Small decorative bubbles -->
  <circle cx="120" cy="130" r="20" fill="white" opacity="0.2"/>
  <circle cx="100" cy="170" r="10" fill="white" opacity="0.15"/>
  <circle cx="380" cy="120" r="15" fill="white" opacity="0.15"/>
  <circle cx="400" cy="160" r="8" fill="white" opacity="0.1"/>
  
  <!-- Music note - main body (bubble style) -->
  <g filter="url(#glow)">
    <!-- Note head -->
    <ellipse cx="200" cy="320" rx="52" ry="40" transform="rotate(-20 200 320)" fill="white"/>
    <!-- Note stem -->
    <rect x="245" y="140" width="14" height="185" rx="7" fill="white" transform="rotate(-5 252 230)"/>
    <!-- Note flag -->
    <path d="M259 140 C259 140 310 160 310 200 C310 220 280 210 259 195" fill="white" opacity="0.9"/>
  </g>
  
  <!-- Sparkle effects -->
  <g fill="white" opacity="0.8">
    <path d="M350 200 L355 190 L360 200 L370 205 L360 210 L355 220 L350 210 L340 205 Z"/>
    <path d="M140 260 L143 253 L146 260 L153 263 L146 266 L143 273 L140 266 L133 263 Z" transform="scale(0.7) translate(60 80)"/>
    <path d="M380 300 L383 293 L386 300 L393 303 L386 306 L383 313 L380 306 L373 303 Z" transform="scale(0.5) translate(380 200)"/>
  </g>
  
  <!-- Bottom shine -->
  <ellipse cx="256" cy="420" rx="160" ry="20" fill="white" opacity="0.08"/>
</svg>
